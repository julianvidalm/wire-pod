// MicTap: Vector streams what it hears (and plays) to the cortex (wire-pod).
//
// The robot is the client: vic-cloud opens Stream on the wire-pod gRPC server it already uses for chipper
// (host and port from /data/data/server_config.json, TLS with the pinned wire-pod certificate), so no port is
// open on the robot and the link works across NAT boundaries.
//
// The canonical copy of this file lives in julianvidalm/wire-pod (chipper/pkg/mictap/mictappb/mictap.proto);
// the firmware keeps an identical copy. Regenerate Go code with protoc-gen-go v1.36.6 and
// protoc-gen-go-grpc v1.5.1 (see chipper/pkg/mictap/mictappb/generate.go).

syntax = "proto3";

package v3ctor.mictap.v1;

option go_package = "github.com/kercre123/wire-pod/chipper/pkg/mictap/mictappb";

service MicTap {
  // Stream carries the MicTap v1 byte stream (one hello, then frames), split into chunks at any byte boundary.
  // The robot sends its ESN in the "x-vector-esn" request metadata. The server answers when the stream ends.
  rpc Stream(stream Chunk) returns (StreamSummary);

  // Session is Stream plus a way back: the robot sends the same chunks, and the cortex sends commands for the
  // robot to carry out (the answer to something it heard). The robot keeps the call open while MicTap runs,
  // so the cortex never has to connect to the robot. Robots fall back to Stream when Session is unimplemented.
  rpc Session(stream Chunk) returns (stream Command);
}

// Command is something the robot should do now.
message Command {
  oneof command {
    // A chipper-style intent result, delivered to the engine as if it answered the robot's own voice request
    // (for example intent_clock_time).
    IntentResult intent_result = 1;
    // Text for Vector to say, with its knowledge-graph animations.
    KnowledgeResponse knowledge = 2;
    // Wake up as if the user had said "Hey Vector" (or pressed the backpack button): get-in animation,
    // earcon, then the robot's normal voice request, which the cortex answers with what it already heard.
    Wake wake = 3;
  }
}

message Wake {}

message IntentResult {
  string intent = 1;
  string parameters_json = 2;
  string metadata = 3;
}

message KnowledgeResponse {
  string answer = 1;
  string query_text = 2;
}

message Chunk {
  bytes data = 1;
}

message StreamSummary {
  uint64 mic_frames = 1;
  uint64 speaker_frames = 2;
}
