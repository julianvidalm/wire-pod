<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Robots · v3ctor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/shell.js"></script>
</head>

<body>
  <div id="outer">
    <main id="content" style="max-width: 640px">
      <div class="page-head">
        <div>
          <h1>Robots</h1>
          <p>Open a robot's settings and controls. The robot must be on and connected.</p>
        </div>
      </div>
      <div class="section">
        <label for="botList">Robot</label>
        <div class="field-row">
          <select id="botList" name="botList"></select>
          <div style="flex: 0 0 auto">
            <button type="button" onclick="connectSDK()"><svg class="icon"><use href="/assets/icons.svg#robot"></use></svg>Open</button>
          </div>
        </div>
        <div id="authResult"></div>
      </div>
    </main>
  </div>

  <iframe name="hiddenFrame" width="0" height="0" style="display: none" title="hidden"></iframe>
  <script src="./js/httprequest.js"></script>
  <script src="./js/common.js"></script>
  <script src="../js/ui.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
