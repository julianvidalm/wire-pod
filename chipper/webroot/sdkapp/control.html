<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Control · v3ctor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/shell.js"></script>
</head>

<body onload="updateControlButtons()">
  <div id="outer">
    <main id="content">
      <div class="page-head">
        <div>
          <h1>Control</h1>
          <p>Drive the robot, see what it sees and make it talk. Take control first.</p>
        </div>
        <button type="button" class="secondary" onclick="goBackToSettings()"><svg class="icon"><use href="/assets/icons.svg#arrow-left"></use></svg>Back to the robot</button>
      </div>

      <div id="sdkActions" class="grid-cards">
        <div class="section">
          <h2><svg class="icon"><use href="/assets/icons.svg#camera"></use></svg> Camera</h2>
          <div id="camStream" class="cam"></div>
          <div class="choices">
            <label><input type="radio" name="cam" id="cam" onclick="showCamStream()">Stream</label>
            <label><input type="radio" name="cam" id="cam-off" onclick="stopCamStream()" checked>Off</label>
          </div>
        </div>

        <div class="section">
          <h2><svg class="icon"><use href="/assets/icons.svg#gamepad"></use></svg> Control</h2>
          <label>Behavior control <span class="hint">Needed for everything on this page</span></label>
          <div class="choices">
            <label><input type="radio" name="control" id="assume_control"
                onclick="sendForm('/api-sdk/assume_behavior_control?priority=high'); updateControlButtons();">Take control</label>
            <label><input type="radio" name="control" id="release_control"
                onclick="sendForm('/api-sdk/release_behavior_control'); updateControlButtons();" checked>Let it be free</label>
          </div>
          <label>Keyboard driving <span class="hint">Experimental</span></label>
          <div class="choices">
            <label><input type="radio" name="keycontrol" id="key_control_on" onclick="toggleKeyboard()" disabled>On</label>
            <label><input type="radio" name="keycontrol" id="key_control_off" onclick="toggleKeyboard()" checked disabled>Off</label>
          </div>
          <div id="keysKey" class="notice" style="display: none">
            <svg class="icon"><use href="/assets/icons.svg#info"></use></svg>
            <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> wheels · <kbd>R</kbd>/<kbd>F</kbd> lift up/down ·
              <kbd>T</kbd>/<kbd>G</kbd> head up/down</span>
          </div>
          <label>Mirror mode <span class="hint">Shows the camera on its face</span></label>
          <div class="choices">
            <label><input type="radio" name="mirror" id="mirror_on" onclick="sendForm('/api-sdk/mirror_mode?enable=true')" disabled>On</label>
            <label><input type="radio" name="mirror" id="mirror_off" onclick="sendForm('/api-sdk/mirror_mode?enable=false')" checked disabled>Off</label>
          </div>
        </div>

        <div class="section">
          <h2><svg class="icon"><use href="/assets/icons.svg#message"></use></svg> Say something</h2>
          <label for="textSay">Text</label>
          <form class="field-row" onsubmit="sayText(); return false;">
            <input name="textSay" id="textSay" type="text" placeholder="Hello! Nice to meet you." disabled />
            <div style="flex: 0 0 auto"><button type="submit">Say it</button></div>
          </form>
        </div>

        <div class="section">
          <h2><svg class="icon"><use href="/assets/icons.svg#volume"></use></svg> Play a sound</h2>
          <label for="fileInput">WAV file</label>
          <input type="file" id="fileInput" accept=".wav">
          <audio id="audioOutput" controls></audio>
          <div class="actions">
            <button id="uploadButton" style="display: none;" type="button"><svg class="icon"><use href="/assets/icons.svg#upload"></use></svg>Play on the robot</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <iframe name="hiddenFrame" width="0" height="0" style="display: none" title="hidden"></iframe>
  <script src="./js/httprequest.js"></script>
  <script src="./js/control.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/play_audio.js"></script>
</body>

</html>
